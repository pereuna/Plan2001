<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan2001 wasm32</title>
<meta name="plan2001-version" content="@VERSION@">
<style>
	:root { --bg: #fff; --fg: #000; }
	@media (prefers-color-scheme: dark) { :root { --bg: #111; --fg: #ddd; } }
	html, body { margin: 0; height: 100%; overflow: hidden; background: #777; }
	body { color: var(--fg); font: 14px monospace; }
	/* the machine's screen is the window (rio in all of it); ?console=1 the serial port below it */
	canvas { display: block; width: 100vw; height: 100vh; background: #777; touch-action: none; outline: none; }
	pre { display: none; margin: 0; padding: 16px; white-space: pre-wrap; word-break: break-all; background: var(--bg); }
	body.console { overflow: auto; }
	body.console canvas { width: auto; height: auto; max-width: 100%; margin: 0 auto; }
	body.console #eia0 { display: block; }	/* the console's, not #halt's (a pre too) */
	/* the console alone, its prompt in view, until a program draws (rio): the kernel's and init's messages, the site's login (/boot/login), a cpu machine's rc */
	body.login canvas { display: none; }
	body.login #eia0 { min-height: 100vh; min-height: 100dvh; box-sizing: border-box; }	/* dvh: a phone's 100vh is taller than what shows */
	#halt { display: none; position: fixed; left: 0; right: 0; bottom: 0; padding: 8px 16px; background: var(--bg); }
</style>
</head>
<body>
<!-- Plan2001's wasm32 machine (sys/src/9/wasm32): its screen the window (?screen=WxH another size), its serial port with ?console=1 -->
<canvas id="screen" width="800" height="600"></canvas>
<pre id="eia0"></pre>
<pre id="halt"></pre>
<script type="module">
import { boot } from './platform.js';
const pre = document.getElementById('eia0'), dec = new TextDecoder();
/* the page's version (monolith/tools/pages: the commit and its time), so that a cached page shows */
const version = document.querySelector('meta[name=plan2001-version]')?.content ?? '';
if (version && !version.startsWith('@')) {
	pre.textContent = 'Plan2001 page ' + version + '\n';
	document.title += ' ' + version;
}
// init: ?arg=... what it runs, /boot/init (kbdfs and rc) without; ?noinit=1 none (C2a's test);
// ?conf=name=value plan9.ini's lines (BootInfo's config, as init's init=)
const q = new URLSearchParams(location.search);
/*
 * ?debuglog=1: what the page says - its console, its errors, its eia0, its
 * visibility and a heartbeat - to the signaling server's log (tools/rtcsignal
 * --log), to see a phone's page from elsewhere
 */
if (q.get('debuglog') === '1' && q.get('signal')) {
	const ws = new WebSocket(q.get('signal')), held = [], who = q.get('rtcname') || '?';
	const say = (line) => { const m = JSON.stringify({ type: 'log', name: who, line: String(line) }); ws.readyState === 1 ? ws.send(m) : held.push(m); };
	ws.onopen = () => { for (const m of held.splice(0)) ws.send(m); };
	window.debuglog = say;
	for (const k of ['log', 'warn', 'error']) { const f = console[k].bind(console); console[k] = (...a) => { say(k + ': ' + a.join(' ')); f(...a); }; }
	addEventListener('error', (e) => say('error: ' + e.message + ' ' + e.filename + ':' + e.lineno));
	addEventListener('unhandledrejection', (e) => say('rejection: ' + (e.reason?.stack || e.reason)));
	document.addEventListener('visibilitychange', () => say('visibility: ' + document.visibilityState));
	addEventListener('pagehide', () => say('pagehide'));
	addEventListener('resize', () => say('resize: ' + innerWidth + 'x' + innerHeight));
	new MutationObserver(() => say('body: ' + document.body.className)).observe(document.body, { attributes: true, attributeFilter: ['class'] });
	let n = 0;
	setInterval(() => {
		const r = document.getElementById('eia0').getBoundingClientRect(), v = visualViewport;
		say('alive ' + (++n) + ' mem ' + (performance.memory?.usedJSHeapSize ?? '?') + ' scrollY ' + Math.round(scrollY) + ' body.scrollTop ' + Math.round(document.body.scrollTop) +
			' pre top ' + Math.round(r.top) + ' h ' + Math.round(r.height) + ' view ' + innerWidth + 'x' + innerHeight + (v ? ' visual ' + Math.round(v.offsetTop) + '+' + Math.round(v.height) + ' scale ' + v.scale : '') +
			' focus ' + (document.activeElement?.id || document.activeElement?.tagName));
	}, 2000);
	say('page: ' + navigator.userAgent + ' ' + innerWidth + 'x' + innerHeight + ' ' + matchMedia('(prefers-color-scheme: dark)').matches);
}
if ((q.get('console') === '1')) document.body.classList.add('console');
const args = q.has('noinit') ? [] : q.getAll('arg').length ? q.getAll('arg') : ['/bin/rc', '/boot/init'];
/*
 * the origin's app (docs/app-origins.md, D7): the server's answer (GET /app,
 * rc-httpd's, as webterm decides it), term without one (a test's server, the
 * sandbox).  An app's machine runs it on the CPU server (/boot/app); the
 * terminal's has rio here and rcpu to $cpu, the page's host
 */
const app = await fetch('app', { cache: 'no-store' }).then((r) => r.ok ? r.text() : 'term').catch(() => 'term');
const appname = /^[a-z0-9-]{1,32}$/.test(app.trim()) ? app.trim() : 'term';
/*
 * the server's secstore, if it has one (GET /secstore: its dial string, a file of the site):
 * the terminal's /boot/init gets factotum's keys from it (/boot/secstore; docs/architecture.md,
 * "Avainten paikka"); without it no password is asked
 */
const sec = appname === 'term' ? await fetch('secstore', { cache: 'no-store' }).then((r) => r.ok ? r.text() : '').catch(() => '') : '';
const secstore = /^[a-z0-9.!-]{1,64}$/.test(sec.trim()) ? sec.trim() : '';
/*
 * and its login (GET /login: the site has accounts and passkeys, docs/webauthn.md): /boot/login's
 * menu.  The file is the passkeys' rp - the site's domain, so that APP.SITE has the same passkeys -
 * if it is this page's host or above it (else 1: the page's host)
 */
const logintext = appname === 'term' ? await fetch('login', { cache: 'no-store' }).then((r) => r.ok ? r.text() : null).catch(() => null) : null;
const login = logintext !== null;
const rpname = (logintext ?? '').trim().toLowerCase();
const passkeyrp = /^[a-z0-9-]+(\.[a-z0-9-]+)*$/.test(rpname) && (location.hostname === rpname || location.hostname.endsWith('.' + rpname)) ? rpname : '';
/*
 * the console alone until a program draws on the screen (rio): what the
 * kernel and init say, the site's login (/boot/login), and the rc of a
 * machine without rio (service=cpu) - before, the screen's grey hid them
 */
const loginconsole = () => appname === 'term' && !(q.get('console') === '1');
if (loginconsole()) document.body.classList.add('console', 'login');
const machine = 'cpu=' + location.hostname + '\n' + (appname !== 'term' ? 'app=' + appname + '\n' : '') +
	(secstore ? 'secstore=' + secstore + '\n' : '') + (login ? 'login=1\n' : '') + (passkeyrp ? 'passkeyrp=' + passkeyrp + '\n' : '');
if (appname !== 'term') document.body.classList.add('console');	/* its key is asked on the console */

// the root (tools/build-bin3): each file's path and 0, its length (4 bytes), its bytes (rootfs.c);
// w3root.fs is all of it, one file (a server that has no directories: webterm), else each from w3root.txt
async function rootfs() {
	const fs = await fetch('w3root.fs');
	if (fs.ok) return new Uint8Array(await fs.arrayBuffer());
	const names = (await (await fetch('w3root.txt')).text()).split('\n').filter((n) => n);
	const files = await Promise.all(names.map(async (n) => n.endsWith('/') ? new Uint8Array(0) : new Uint8Array(await (await fetch('w3root/' + n)).arrayBuffer())));
	const enc = new TextEncoder(), parts = [];
	names.forEach((n, i) => {	/* a directory: n ends in /, no bytes */
		const len = new Uint8Array(4);
		new DataView(len.buffer).setUint32(0, files[i].length, true);
		parts.push(enc.encode(n + '\0'), len, files[i]);
	});
	const a = new Uint8Array(parts.reduce((n, p) => n + p.length, 0));
	let o = 0;
	for (const p of parts) { a.set(p, o); o += p.length; }
	return a;
}

// the keyboard: #b/kbd (devkbd.c) for kbdfs - each key down (r) and up (R)
// as Plan 9's rune. Characters are the browser's (e.key: the system's
// layout applied, äåö as they are), not scancodes: no kbmap
const K = { Enter: '\n', Backspace: '\b', Tab: '\t', Escape: '\x1b', Delete: '\x7f',
	Shift: '\uf016', Control: '\uf017', Alt: '\uf015', AltGraph: '\uf867', Meta: '\uf868',
	ArrowUp: '\uf00e', ArrowDown: '\uf800', ArrowLeft: '\uf011', ArrowRight: '\uf012',
	Home: '\uf00d', End: '\uf018', PageUp: '\uf00f', PageDown: '\uf013', Insert: '\uf014' };
const down = new Map();	/* e.code: the rune its down sent, for its up */
document.addEventListener('keydown', (e) => {
	/* Meta itself is Plan 9's Kmod4; Meta with another key is the browser's (its shortcuts) */
	if (!window.monolith || e.metaKey && e.key !== 'Meta') return;
	/* Ctrl-C with text selected (the console's) is the browser's copy */
	if (e.ctrlKey && (e.key === 'c' || e.key === 'C' || e.key === 'Insert') && String(getSelection()).length) return;
	/* Ctrl-V and Shift-Insert are the browser's paste: its paste event types the text (kernelpaste) */
	if (e.ctrlKey && !e.altKey && (e.key === 'v' || e.key === 'V') || e.shiftKey && e.key === 'Insert') return;
	const r = K[e.key] ?? ([...e.key].length === 1 ? e.key : undefined);
	if (r === undefined) return;
	down.set(e.code, r);
	window.monolith.kbd('r' + r + '\0');
	e.preventDefault();
});
document.addEventListener('keyup', (e) => {
	if (!window.monolith) return;
	const r = down.get(e.code);
	if (r === undefined) return;
	down.delete(e.code);
	window.monolith.kbd('R' + r + '\0');
	e.preventDefault();
});
window.addEventListener('blur', () => {	/* keys let go elsewhere */
	for (const r of down.values()) window.monolith?.kbd('R' + r + '\0');
	down.clear();
});
/*
 * paste: each character as a key down and up - kbdfs's key path waits
 * for its readers (its c path drops what it has no room for), and rio
 * gets them as typed.  The modifiers let go first: Ctrl is down after
 * Ctrl-V, and kbdfs would make the text control characters
 */
window.kernelpaste = (text) => {
	if (!window.monolith) return;
	for (const k of ['Shift', 'Control', 'Alt', 'AltGraph', 'Meta']) window.monolith.kbd('R' + K[k] + '\0');
	for (const c of text.replace(/\r\n?/g, '\n')) window.monolith.kbd('r' + c + '\0R' + c + '\0');
};
/*
 * a phone: no keyboard of its own on the page yet (the key bar and its #kbd
 * field were taken away 10.10.2026: opening the phone's keyboard scrolled the
 * page, and the console went out of view); a finger is mouse button 1
 */
document.addEventListener('paste', (e) => {
	window.kernelpaste(e.clipboardData.getData('text'));
	e.preventDefault();
});

boot('9wasm32.wasm', {
	eia: (b) => {
		window.debuglog?.('eia0: ' + new TextDecoder().decode(b));
		pre.textContent += dec.decode(b, { stream: true });
		if (document.body.classList.contains('login')) scrollTo(0, document.body.scrollHeight);	/* the prompt in view */
	},
	drawn: () => { if (loginconsole()) document.body.classList.remove('console', 'login'); },
	halt: (why) => {
		pre.textContent += '\n[halted: ' + why + ']\n';
		if (!(q.get('console') === '1')) { const h = document.getElementById('halt'); h.textContent = 'Plan2001 halted: ' + why; h.style.display = 'block'; }
	},
	fs: args.length ? await rootfs() : undefined,
	args,
	/* the machine's disk (#S/sdW0): OPFS, ?disk=MB (256), ?disk=0 none */
	disk: (q.get('disk') ?? '256') !== '0' && navigator.storage?.getDirectory ? { name: 'sdW0', size: Number(q.get('disk') ?? 256) * 1048576, fail: q.get('diskfail') } : null,
	config: machine + q.getAll('conf').map((c) => c + '\n').join(''),
	canvas: document.getElementById('screen'),
	screen: (([w, h]) => ({ w: Number(w) || ((q.get('console') === '1') ? 800 : innerWidth), h: Number(h) || ((q.get('console') === '1') ? 600 : innerHeight) }))((q.get('screen') ?? '').split('x')),
	/* the machine's webterm, as Monolith's page finds it: ?ws=, wss on https, else the next port */
	/*
	 * the machine's network: this origin's own webterm, nothing a URL can
	 * change - an app's rcpu has no TLS of its own inside the WebSocket
	 * (aux/wsrcpu), so the page must not be pointed elsewhere (the review's:
	 * ?ws= was a man in the middle).  https: wss on this host; http only
	 * on loopback, the next port (tools/serve's relay: development and tests)
	 */
	ws: location.protocol === 'https:' ? `wss://${location.host}`
		: /^(127\.0\.0\.1|localhost|\[::1\])$/.test(location.hostname) ? `ws://${location.hostname}:${location.port ? +location.port + 1 : 8081}`
		: 'ws://0.0.0.0:0',	/* none */
	/*
	 * the machine's WebRTC peers (devwsnet.c's NAME.rtc!port, announce): a
	 * signaling server (tools/rtcsignal), this machine's name in its room and
	 * STUN servers.  The server only introduces the peers; it could put itself
	 * in the middle, as ?ws= could, so what goes over a channel authenticates
	 * itself (dp9ik, TLS) - no app's rcpu goes this way
	 */
	signal: q.get('signal'),
	rtcname: q.get('rtcname'),
	rtcroom: q.get('rtcroom'),
	ice: q.getAll('stun').map((urls) => ({ urls })),
	failfork: Number(q.get('failfork')) || 0,
	ringstart: Number(q.get('ringstart')) || 0,	/* a test's: the network rings' counters start there */
	failhelper: Number(q.get('failhelper')) || 0,
	failrfmem: Number(q.get('failrfmem')) || 0,
	bad: q.get('bad'),	/* a test's: a BootInfo the kernel must refuse (arch, rd, fb; platform.js) */
	oldheader: q.has('oldheader'),	/* a test's: an older v1 loader's shorter header */
});
</script>
</body>
</html>

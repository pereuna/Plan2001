<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan2001 Compute</title>
<style>
html, body { height: 100%; margin: 0; background: #000; }
body { color: #7a6a3a; font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace; display: flex; align-items: center; justify-content: center; user-select: none; }
main { text-align: center; }
#clock { font-size: clamp(48px, 14vw, 132px); letter-spacing: .06em; color: #b08a2e; opacity: .55; font-variant-numeric: tabular-nums; }
#line { margin-top: 18px; display: flex; align-items: center; justify-content: center; gap: 10px; }
#dot { width: 7px; height: 7px; border-radius: 50%; background: #b08a2e; opacity: .12; }
#dot.on { animation: breathe 6s ease-in-out infinite; }
@keyframes breathe { 0%, 100% { opacity: .12; } 50% { opacity: .75; } }
#state { opacity: .7; }
#more { margin-top: 28px; opacity: .45; }
#more:hover { opacity: .8; }
a, button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline dotted; }
button:disabled { cursor: default; text-decoration: none; }
#threads { width: 7em; vertical-align: middle; accent-color: #7a6a3a; }
#stats { margin-top: 6px; }
#log { display: none; }
</style>
</head>
<body>
<main>
<div id="clock">00:00:00</div>
<div id="line"><span id="dot"></span><span id="state">CR off</span></div>
<div id="more">
<div><button id="go">share spare compute</button></div>
<div id="choose"><input id="threads" type="range" min="1"> <span id="tval"></span> threads</div>
<div id="stats"><span id="sharing"></span> <span id="jobs"></span> <span id="time"></span> <span id="busy"></span></div>
</div>
<pre id="log"></pre>
</main>
<script src="cr.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=overlays-content">
<title>Monolith</title>
<style>
:root { --bg: #000; --fg: #d8d8d8; --dim: #888; --bar: #1c1c1c; --key: #333; --on: #4a9a9a; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg); font: 14px/1.4 monospace; }
body { display: flex; flex-direction: column; }
#box { flex: 1; min-height: 0; overflow: hidden; }
#screen { display: block; outline: none; touch-action: none; }
#out { margin: 0; padding: 16px; white-space: pre-wrap; word-break: break-all; height: 100%; overflow: auto; box-sizing: border-box; }
#status { position: fixed; left: 0; top: 0; padding: 4px 12px; color: var(--dim); background: rgba(0,0,0,.6); pointer-events: none; }
#status:empty { display: none; }
#bar { display: flex; gap: 6px; padding: 6px; background: var(--bar); touch-action: none; user-select: none; -webkit-user-select: none; }
#bar button { flex: 1; min-width: 0; height: 40px; border: 0; border-radius: 6px; background: var(--key); color: var(--fg); font: 16px monospace; }
#bar button.on { background: var(--on); color: #000; }
#kbd { position: fixed; left: 0; bottom: 0; width: 1px; height: 1px; opacity: 0; border: 0; padding: 0; font-size: 16px; resize: none; }
.hidden { display: none !important; }
</style>
</head>
<body>
<div id="box"><canvas id="screen" tabindex="0" class="hidden"></canvas><pre id="out" class="hidden"></pre></div>
<div id="bar" class="hidden">
	<button data-b="1" class="on">1</button><button data-b="2">2</button><button data-b="4">3</button>
	<button id="esc">Esc</button><button id="showkbd">⌨</button>
</div>
<textarea id="kbd" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>
<div id="status">loading drawterm…</div>
<script>
// drawterm in the page.  Arguments come from the query
// (?a=-h&a=127.0.0.1...), the password from the fragment (#pass=...), which
// is never sent to the server.  Default: drawterm's console on the Plan2001
// VM through tools/serve's proxy.  With -G the page shows drawterm's text
// output only.  On a touch screen (or ?touch=1) a bar below the screen picks
// the mouse button for the next touch and opens the on-screen keyboard.
(() => {
const q = new URLSearchParams(location.search);
const frag = new URLSearchParams(location.hash.slice(1));
const args = q.getAll('a').length ? q.getAll('a')
	: ['-h', '127.0.0.1', '-a', 'tcp!127.0.0.1!5670', '-u', q.get('user') || 'glenda'];
const textonly = args.includes('-G');
const touchui = q.has('touch') ? q.get('touch') !== '0' : matchMedia('(pointer: coarse)').matches;
const box = document.getElementById('box');
const canvas = document.getElementById('screen');
const ctx = canvas.getContext('2d', { alpha: false });
const out = document.getElementById('out');
const bar = document.getElementById('bar');
const kbd = document.getElementById('kbd');
const status = document.getElementById('status');
(textonly ? out : canvas).classList.remove('hidden');
if (touchui && !textonly)
	bar.classList.remove('hidden');

function setstatus(t) { status.textContent = t; if (t) console.log('monolith: ' + t); }
function show(t) { out.textContent += t + '\n'; console.log(t); }
let ready = false;	// the runtime is up: _webpush may be called
function push(type, a, b, c) { if (ready) Module._webpush(type, a, b, c); }
const Evmouse = 1, Evkey = 2, Evresize = 3;

// screen: the box above the bar, one Plan 9 pixel per CSS pixel
let flushes = 0;
function size() { return [Math.max(64, box.clientWidth | 0), Math.max(64, box.clientHeight | 0)]; }

// mouse: DOM buttons 1 left, 2 right, 4 middle; Plan 9 1 left, 2 middle,
// 4 right, 8 and 16 the wheel.  A touch is the button chosen in the bar,
// for one touch; then button 1 again.
let buttons = 0, mx = 0, my = 0, touchb = 1;
function p9buttons(b) { return (b & 1) | (b & 4 ? 2 : 0) | (b & 2 ? 4 : 0); }
function mouse(e) {
	const r = canvas.getBoundingClientRect();
	mx = Math.round(e.clientX - r.left); my = Math.round(e.clientY - r.top);
	buttons = e.pointerType === 'touch' ? (e.buttons ? touchb : 0) : p9buttons(e.buttons);
	push(Evmouse, mx, my, buttons);
}
function choose(b) {
	touchb = b;
	for (const x of bar.querySelectorAll('[data-b]'))
		x.classList.toggle('on', +x.dataset.b === b);
}
canvas.addEventListener('pointermove', mouse);
canvas.addEventListener('pointerdown', e => {
	if (e.pointerType !== 'touch')
		canvas.focus();
	canvas.setPointerCapture(e.pointerId);
	mouse(e);
	e.preventDefault();
});
canvas.addEventListener('pointerup', e => {
	mouse(e);
	if (e.pointerType === 'touch')
		choose(1);
	e.preventDefault();
});
canvas.addEventListener('pointercancel', e => { push(Evmouse, mx, my, buttons = 0); choose(1); });
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('wheel', e => {
	const w = e.deltaY < 0 ? 8 : 16;
	push(Evmouse, mx, my, buttons | w);
	push(Evmouse, mx, my, buttons);
	e.preventDefault();
}, { passive: false });

// keyboard: KeyboardEvent.key to Plan 9 runes (keyboard.h)
const KF = 0xF000, Spec = 0xF800;
const special = {
	Enter: 10, Backspace: 8, Tab: 9, Escape: 0x1b, Delete: 0x7f,
	ArrowUp: KF|0x0E, ArrowDown: Spec|0x00, ArrowLeft: KF|0x11, ArrowRight: KF|0x12,
	Home: KF|0x0D, End: KF|0x18, PageUp: KF|0x0F, PageDown: KF|0x13, Insert: KF|0x14,
	PrintScreen: KF|0x10, ScrollLock: KF|0x19, Pause: Spec|0x61,
	Shift: KF|0x16, Control: KF|0x17, Alt: KF|0x15, AltGraph: Spec|0x67,
	CapsLock: Spec|0x64, NumLock: Spec|0x65, Meta: Spec|0x68,
};
for (let i = 1; i <= 12; i++) special['F' + i] = KF | i;
function rune(e) {
	if (e.key in special) return special[e.key];
	if ([...e.key].length !== 1) return 0;
	let r = e.key.codePointAt(0);
	if (e.ctrlKey && !e.altKey && r >= 0x40 && r < 0x80) r &= 0x1f;
	return r;
}
function tap(r) { push(Evkey, r, 1, 0); push(Evkey, r, 0, 0); }
function key(e, down) {
	const r = rune(e);
	if (!r) return;
	push(Evkey, r, down ? 1 : 0, 0);
	e.preventDefault();
}
canvas.addEventListener('keydown', e => key(e, true));
canvas.addEventListener('keyup', e => key(e, false));

// on-screen keyboard: a hidden textarea.  Phone keyboards send no usable
// key events (key 'Unidentified'), so what they type is read from the
// textarea's value, which is reset to one space after each change: fewer
// characters is backspace, more is text.  Keys with a name (arrows, Esc,
// Tab, Ctrl-x from a hardware keyboard) still come as key events.
const SENT = ' ';
let composing = false;
function kbdreset() { kbd.value = SENT; kbd.setSelectionRange(SENT.length, SENT.length); }
function kbdread() {
	const v = kbd.value;
	if (v.length < SENT.length)
		for (let i = v.length; i < SENT.length; i++) tap(8);
	else
		for (const c of v.startsWith(SENT) ? v.slice(SENT.length) : v) tap(c.codePointAt(0));
	kbdreset();
}
kbd.addEventListener('input', () => { if (!composing) kbdread(); });
kbd.addEventListener('compositionstart', () => { composing = true; });
kbd.addEventListener('compositionend', () => { composing = false; kbdread(); });
kbd.addEventListener('keydown', e => {
	if (e.key === 'Unidentified' || e.key === 'Backspace' || e.key === 'Enter' || e.isComposing)
		return;	// through the textarea's value
	if (e.key in special || e.ctrlKey) {
		const r = rune(e);
		if (r) { tap(r); e.preventDefault(); }
	}
});
kbdreset();

// the bar: buttons act on touch down, and keep the focus where it was
for (const b of bar.querySelectorAll('button'))
	b.addEventListener('pointerdown', e => e.preventDefault());
bar.addEventListener('click', e => {
	const b = e.target.closest('button');
	if (!b) return;
	if (b.dataset.b) choose(+b.dataset.b === touchb ? 1 : +b.dataset.b);
	else if (b.id === 'esc') tap(0x1b);
	else if (b.id === 'showkbd') {
		if (document.activeElement === kbd) kbd.blur();
		else { kbdreset(); kbd.focus(); }
	}
});

let resizing;
function resized() {
	clearTimeout(resizing);
	resizing = setTimeout(() => { const [w, h] = size(); push(Evresize, w, h, 0); }, 150);
}
window.addEventListener('resize', resized);
new ResizeObserver(resized).observe(box);

// the canvas and cursor, called by gui-web (webjs.c) on the main thread
const cursorcanvas = document.createElement('canvas');
cursorcanvas.width = cursorcanvas.height = 16;
window.Module = {
	arguments: args,
	preRun: [m => {
		if (frag.get('pass')) m.ENV.PASS = frag.get('pass');
		m.ENV.USER = q.get('user') || 'glenda';
		m.ENV.MONOLITH_BRIDGE = q.get('bridge') || 'ws://127.0.0.1:8081';
	}],
	print: show,
	printErr: show,
	onRuntimeInitialized: () => { ready = true; setstatus(textonly ? 'drawterm ' + args.join(' ') : 'connecting…'); },
	onExit: code => { setstatus('drawterm exited (' + code + ')'); console.log('MONOLITH-EXIT ' + code); },
	monolithSize: size,
	monolithResize: (w, h) => {
		canvas.width = w; canvas.height = h;
		canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
	},
	monolithFlush: (img, x, y) => {
		ctx.putImageData(img, x, y);
		if (flushes++ === 0) {
			setstatus(''); console.log('MONOLITH-FLUSH first');
			if (!touchui) canvas.focus();
		}
	},
	monolithCursor: (img, hx, hy) => {
		cursorcanvas.getContext('2d').putImageData(img, 0, 0);
		hx = Math.min(15, Math.max(0, hx)); hy = Math.min(15, Math.max(0, hy));
		canvas.style.cursor = `url(${cursorcanvas.toDataURL()}) ${hx} ${hy}, default`;
	},
};
// for tests driving the page (tools/test-rio)
window.monolith = { push, get flushes() { return flushes; } };

if (!crossOriginIsolated)
	setstatus('not cross-origin isolated: serve with tools/serve (COOP/COEP) on localhost or HTTPS');

})();
</script>
<script src="drawterm.js"></script>
</body>
</html>
